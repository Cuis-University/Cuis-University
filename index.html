<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Cuis University</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #f6f7f9; color: #1a1a1a; padding: 2rem; }
  @media (prefers-color-scheme: dark) { body { background: #16181d; color: #e8e8e8; } .card { background:#1f2229; border-color:#30343d; } .sub{color:#9aa0aa;} }
  .wrap { width: 100%; max-width: 560px; text-align: center; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  .tagline { color: #667; margin: 0 0 1.75rem; }
  .cards { display: grid; gap: 1rem; }
  .card { display: block; text-decoration: none; color: inherit; text-align: left;
          background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 1.1rem 1.25rem;
          transition: transform .08s ease, box-shadow .08s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.10); }
  .card .name { font-size: 1.15rem; font-weight: 650; }
  .card .sub { color: #667; font-size: .93rem; margin-top: .2rem; }
  .arrow { float: right; font-size: 1.3rem; opacity: .5; }
  .foot { margin-top: 1.5rem; font-size: .9rem; }
  .foot a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Download Cuis University</h1>
  <p class="tagline">Always the latest release &mdash; the version is in the file name.</p>
  <div class="cards">
    <a class="card" href="full.html">
      <span class="arrow">&rarr;</span>
      <div class="name">Full</div>
      <div class="sub">Everything: image, VMs, sources, packages and history. Largest download.</div>
    </a>
    <a class="card" href="slim.html">
      <span class="arrow">&rarr;</span>
      <div class="name">Slim</div>
      <div class="sub">Ready to run, without history and heavy dev/media files. Much smaller.</div>
    </a>
  </div>
  <p class="foot"><a href="https://github.com/Cuis-University/Cuis-University/releases">See all releases &amp; changelog</a></p>
</div>
</body>
</html>
